/* Comments */
function appendText(node,text){
  const re=/\[[^\[\]\r\n]{1,16}\]/g;let at=0;const str=String(text||'');
  for(const m of str.matchAll(re)){node.append(str.slice(at,m.index));const id=EMOJI[m[0]];node.append(id?h('img',{src:'/emoji/'+id+'.webp',alt:m[0],loading:'lazy'}):m[0]);at=m.index+m[0].length}
  node.append(str.slice(at));
}
const AVATAR=['#34a853','#4285f4','#f29900','#d93025','#9334e6','#00897b','#e8710a','#1a73e8'];
function openComments(s,episode=0){
  const list=h('div'),end=h('div',{class:'list-end'});
  const live=playing()&&S.tv.id===String(s.id)&&S.tv.episode;
  const seg=live?h('div',{class:'seg',role:'tablist'}):null;
  const tabs=seg?h('div',{class:'comment-tabs-sticky'},h('div',{class:'me-seg'},seg)):null;
  const sheet=openSheet({title:'评论',body:h('div',{},tabs,list,end)});
  sheet.panel.classList.add('sheet-fixed','comment-sheet');   // 固定高度：评论弹层略高，加载中不会忽高忽低
  let st={},token=0;
  function load(ep){
    token++;st={ep,offset:0,more:true,busy:false,seen:new Set()};list.replaceChildren();end.replaceChildren(h('span',{text:'正在加载…'}));
    if(seg)seg.replaceChildren(h('button',{class:ep?'':'on',text:'整部剧',onclick:()=>load(0)}),h('button',{class:ep?'on':'',text:'第 '+S.tv.episode+' 集',onclick:()=>load(Number(S.tv.episode))}));
    more();
  }
  async function more(){
    if(st.busy||!st.more)return;st.busy=true;const my=token;
    try{
      const j=await api('/api/comments?id='+s.id+'&episode='+(st.ep||0)+'&offset='+st.offset);if(my!==token)return;
      st.offset=j.offset;st.more=!!j.more;if(j.total)sheet.setSub('共 '+j.total+' 条');
      for(const c of j.items||[]){
        if(st.seen.has(c.id))continue;st.seen.add(c.id);
        const imgs=(Array.isArray(c.images)?c.images:[]).filter(u=>typeof u==='string'&&u);
        if(!String(c.text||'').trim()&&!imgs.length)continue;
        const text=h('div',{class:'comment-text'});appendText(text,c.text);
        const name=c.name||'观众';
        /* 真实头像：图片铺在首字占位上，加载成功后淡入；加载失败仍保留首字 */
        const av=h('div',{class:'avatar',style:'background:'+AVATAR[[...name].reduce((a,ch)=>a+ch.charCodeAt(0),0)%AVATAR.length],text:[...name][0]});
        if(/^https?:/.test(c.avatar||'')){const im=h('img',{alt:'',referrerpolicy:'no-referrer',decoding:'async',loading:'lazy'});im.onload=()=>im.classList.add('ready');im.onerror=()=>im.remove();im.src=c.avatar;av.append(im)}
        list.append(h('article',{class:'comment'},av,
          h('div',{class:'comment-main'},h('div',{class:'comment-top'},h('strong',{text:name}),h('span',{},icon('heart'),String(c.likes||0))),text,
            imgs.length?h('div',{class:'comment-imgs'},imgs.slice(0,3).map(u=>{const im=h('img');loadImg(im,u,true);return im})):null)));
      }
      end.replaceChildren(st.more?h('span',{text:'上滑加载更多'}):h('span',{text:list.childElementCount?'没有更多评论了':'还没有评论'}));
    }catch(e){if(my===token)end.replaceChildren(h('span',{text:e.message}),h('button',{class:'btn btn-fill',text:'重试',onclick:()=>{st.busy=false;more()}}))}
    finally{if(my===token)st.busy=false}
  }
  sheet.body.addEventListener('scroll',()=>{const b=sheet.body;if(b.scrollTop+b.clientHeight>b.scrollHeight-400)more()},{passive:true});
  load(episode&&live?episode:0);
}

  if(item.online)return '已上线';
  // 有预计上线时间就写时间；没有时间时官方文案带具体日期才用；「敬请期待」这类空话不显示
  let time=Number(item.time)||0;if(time>0){if(time<1000000000000)time*=1000;const date=new Date(time);if(!Number.isNaN(date.getTime()))return (date.getMonth()+1)+'月'+date.getDate()+'日 上线'}
  const label=String(item.publishText||'').trim();if(/\d/.test(label))return label;
  return '待上线';
}

      if(loading){box.replaceChildren(...[['播放',4],['弹幕',4],['外观',2],['数据',2],['关于',1]].map(([t,n])=>group(t,Array.from({length:n},()=>h('div',{class:'cell'},h('span',{class:'cell-icon',style:'background:var(--fill)'}),h('span',{class:'label'},h('span',{class:'sk-line',style:'display:inline-block;width:42%;height:15px;vertical-align:middle'})))))));return}

/* ==========================================================================

   ========================================================================== */
const FACTORY={home:HomePage,browse:()=>BrowsePage(false),rank:()=>BrowsePage(true),remote:RemotePage,me:MePage,detail:DetailPage,search:SearchPage,settings:SettingsPage,board:BoardPage};
const roots={};let stack=[],tab='home';
function makePage(route){const p=FACTORY[route.page](route);p.route=route;p.scroll=0;p.el.hidden=true;$('views').append(p.el);return p}
function topPage(){return stack[stack.length-1]}
/* 页面转场：支持 View Transitions 的浏览器做 iOS 式推入/返回；其它浏览器给新页面一个入场动画。
   iOS Safari 边缘右滑返回时系统已经播了动画（hasUAVisualTransition），不再叠一层。 */
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)');

  if(document.startViewTransition&&kind!=='tab'){
    const html=document.documentElement;html.dataset.nav=kind;
    try{const vt=document.startViewTransition(update);vt.finished.finally(()=>{if(html.dataset.nav===kind)delete html.dataset.nav});return}
    catch(_){delete html.dataset.nav}
  }
  update();

  const k=kind==='push'?[{transform:'translateX(36%)',opacity:.4},{transform:'none',opacity:1}]
    :kind==='pop'?[{transform:'translateX(-18%)',opacity:.6},{transform:'none',opacity:1}]
    :[{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}];
  el.animate(k,{duration:kind==='tab'?220:380,easing:'cubic-bezier(.2,.8,.2,1)'});
}
function present(p){
  for(const old of document.querySelectorAll('#views>.page:not([hidden])')){if(old===p.el)continue;const o=[...stack,...Object.values(roots)].find(x=>x.el===old);if(o)o.scroll=scrollY;old.hidden=true}
  p.el.hidden=false;p.show?.();
  scrollTo(0,p.scroll||0);
  requestAnimationFrame(()=>{scrollTo(0,p.scroll||0);onScroll()});
  for(const b of document.querySelectorAll('#tabbar [data-tab]'))b.classList.toggle('on',b.dataset.tab===tab);
  moveLens();
  document.title=(p.title&&p.title!=='首页'?p.title+' · ':'')+'绿果TV';
  requestAnimationFrame(()=>Glass.watch(p.el));
  renderMini();
}
function discard(p){if(!p||Object.values(roots).includes(p))return;p.destroy?.();p.el.remove()}
function root(t){return roots[t]||(roots[t]=makePage({page:t}))}
function switchTab(t){
  if(t===tab&&stack.length===1){if(scrollY>0)scrollTo({top:0,behavior:'smooth'});return}
  history.pushState({app:'lv',tab:t,depth:0,route:{page:t}},'');
  transition('tab',()=>{
    for(const p of stack.slice(1))discard(p);
    tab=t;stack=[root(t)];roots[t].scroll=roots[t].scroll||0;
    present(stack[0]);
  });
}
function navigate(route){
  const p=makePage(route);stack.push(p);
  history.pushState({app:'lv',tab,depth:stack.length-1,route},'');
  transition('push',()=>present(p));
}
window.addEventListener('popstate',e=>{
  if(sheetOpen){closeSheet();return}
  const st=e.state;
  if(st?.sheet)return;
  if(!st||st.app!=='lv'){exitPrompt();return}
  const kind=e.hasUAVisualTransition?'none':null;
  if(st.tab===tab&&st.depth===stack.length-2){transition(kind||'pop',()=>{discard(stack.pop());present(topPage())});return}
  if(st.tab===tab&&st.depth===stack.length-1&&topPage().route.page===st.route.page)return;
  const forward=st.tab===tab&&st.depth===stack.length;
  transition(kind||(forward?'push':'tab'),()=>{
    for(const p of stack.slice(1))discard(p);
    tab=st.tab;stack=[root(st.tab)];
    if(st.depth>0)stack.push(makePage(st.route));
    present(topPage());
  });
});
async function exitPrompt(){
  history.pushState({app:'lv',tab,depth:stack.length-1,route:topPage().route},'');
  if(await ask({title:'离开手机遥控？',message:'离开后电视会继续播放，重新扫码即可回来。',actions:[{label:'离开',value:'leave'},{label:'留下',value:'',style:'strong'}]})==='leave')history.go(-2);
}
for(const b of document.querySelectorAll('#tabbar [data-tab]'))b.onclick=()=>switchTab(b.dataset.tab);

let lastY=0,travel=0;
function onScroll(){
  const nav=document.querySelector('#views>.page:not([hidden]) .navbar');if(nav)nav.classList.toggle('scrolled',scrollY>8);
  /* iOS 26：向下浏览时 Tab 收窄让出画面，往回滑立刻展开 */
  const y=scrollY,d=y-lastY;lastY=y;travel=(d>0)===(travel>0)?travel+d:d;

}
addEventListener('scroll',onScroll,{passive:true});

    const im=document.createElementNS(NS,'feImage');im.setAttribute('href',mapURL(w,h,r,band,topOnly));im.setAttribute('x',0);im.setAttribute('y',0);im.setAttribute('width',w);im.setAttribute('height',h);im.setAttribute('result','map');im.setAttribute('preserveAspectRatio','none');
    const dm=document.createElementNS(NS,'feDisplacementMap');dm.setAttribute('in','SourceGraphic');dm.setAttribute('in2','map');dm.setAttribute('scale',strength);dm.setAttribute('xChannelSelector','R');dm.setAttribute('yChannelSelector','G');
    f.append(im,dm);defs.append(f);made.set(key,id);return id;
  }
  const ro=ok?new ResizeObserver(es=>{for(const e of es)apply(e.target)}):null;
  function apply(el){
    const w=Math.round(el.offsetWidth),h=Math.round(el.offsetHeight);if(w<8||h<8)return;
    const r=Math.min(parseFloat(getComputedStyle(el).borderTopLeftRadius)||0,h/2,w/2);
    const topOnly=el.classList.contains('dock');
    const strength=topOnly?34:Math.round(Math.min(56,Math.max(18,Math.min(w,h)*.7)));
    const base=getComputedStyle(el).getPropertyValue('--lg-base').trim()||getComputedStyle(document.documentElement).getPropertyValue('--glass-blur').trim();
    const v='url(#'+filterFor(w,h,Math.round(r),strength,topOnly)+') '+base;
    el.style.backdropFilter=v;el.style.webkitBackdropFilter=v;
  }
  /* 不用液态玻璃的折射效果：只保留普通毛玻璃（CSS 里的模糊 + 较实的底色） */
  return {watch(root){return;if(!ok)return;for(const el of (root.matches?.('.lg-target')?[root]:[]).concat([...root.querySelectorAll('.dock,.tab-lens,.btn-glass,.hero-tag,.fav-btn,.detail-actions .btn-fill')]))if(!el.dataset.lg){el.dataset.lg=1;ro.observe(el)}}};
})();

/* Tab 透镜：在选中项之间弹性滑动；按下时微微鼓起 */
function moveLens(){
  const on=document.querySelector('#tabbar [data-tab].on'),lens=$('tabLens');if(!on||!lens)return;
  const inset=6;lens.style.width=(on.offsetWidth-inset*2)+'px';lens.style.setProperty('--x',(on.offsetLeft+inset)+'px');
}
addEventListener('resize',moveLens);
$('tabbar').addEventListener('pointerdown',()=>$('tabbar').classList.add('pressing'));
for(const ev of ['pointerup','pointercancel','pointerleave'])$('tabbar').addEventListener(ev,()=>$('tabbar').classList.remove('pressing'));
new ResizeObserver(moveLens).observe($('tabbar'));

/* ==========================================================================
   门禁：手机遥控关闭 / 需要遥控密码 / 电视强制休息
   授权由电视放在 HttpOnly Cookie 里（不在网址里），浏览器自动带上并续期；
   验证一次之后，直接打开收藏的电视链接即可使用。
   ========================================================================== */
const Gate=(()=>{
  let shown=null,timer=0;
  async function state(){const r=await fetch('/api/remote/state',{cache:'no-store'});return r.json()}
  function clear(){if(shown){shown.remove();shown=null}clearInterval(timer)}
  function page(cls,ic,title,lead,...extra){
    clear();shown=h('div',{class:'gate '+cls,role:'dialog','aria-modal':'true'},icon(ic,'ic'),h('h1',{text:title}),h('p',{class:'lead',text:lead}),...extra);
    document.body.append(shown);return shown;
  }
  /* 状态恢复（重新开启遥控、休息结束）后整页重新加载 */
  function recheck(ms,ok){timer=setInterval(async()=>{try{if(ok(await state()))location.reload()}catch(_){}},ms)}
  function off(){page('','tv-off','手机遥控已关闭','电视上关闭了手机遥控。如需使用，请在电视「设置 → 遥控」中开启。');recheck(8000,s=>s.on)}
  function rest(s){page('night','moon','电视休息中',(s&&s.restUntil?s.restUntil+' 后':'休息结束后')+'恢复使用');recheck(30000,x=>!x.rest)}
  function password(){
    const input=h('input',{type:'password',inputmode:'numeric',pattern:'[0-9]*',maxlength:'6',autocomplete:'current-password','aria-label':'遥控密码',placeholder:'••••'});
    const err=h('div',{class:'err',role:'alert'});
    const btn=h('button',{class:'btn btn-primary btn-block',type:'submit',text:'进入遥控'});
    const form=h('form',{},input,err,btn);
    form.addEventListener('submit',async ev=>{
      ev.preventDefault();const pwd=input.value.trim();
      if(!/^[0-9]{4,6}$/.test(pwd)){err.textContent='请输入 4~6 位数字密码';return}
      btn.disabled=true;err.textContent='';
      try{
        const r=await fetch('/api/remote/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pwd})});
        const j=await r.json().catch(()=>({}));
        if(r.ok&&j.ok){location.reload();return}
        err.textContent=j.error||'验证失败，请重试';input.value='';input.focus();
      }catch(_){err.textContent='连接不到电视，请确认手机和电视在同一 Wi‑Fi'}
      finally{btn.disabled=false}
    });
    page('','lock','输入遥控密码','电视设置了遥控访问密码。验证一次后，这台手机会长期保持授权。',form);
    setTimeout(()=>input.focus(),60);
  }
  function apply(s){if(!s.on){off();return false}if(s.rest){rest(s);return false}if(s.needPassword&&!s.authorized){password();return false}clear();return true}
  return{
    /* 启动前检查；通过才进入正常界面 */
    async enter(next){try{if(apply(await state()))next()}catch(_){next()}},
    /* 接口返回门禁信号时切到对应页面（只切一次） */
    block(d){if(shown)return;if(d.remoteOff)off();else if(d.rest)rest(d);else if(d.needPassword)password()}
  };
})();

/* ==========================================================================
   Boot
   ========================================================================== */
function start(){
  history.replaceState({app:'lv-base'},'');
  history.pushState({app:'lv',tab:'home',depth:0,route:{page:'home'}},'');
  history.scrollRestoration='manual';
  Glass.watch(document.body);
  stack=[root('home')];present(stack[0]);
  /* 电视搜索页的二维码带 #search：扫码后直接进入搜索 */
  if(location.hash==='#search'){history.replaceState(history.state,'',location.pathname+location.search);setTimeout(()=>navigate({page:'search'}),0)}
  poll();setInterval(poll,1000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
}
function welcome(){
  const box=h('div',{class:'welcome',role:'dialog','aria-modal':'true','aria-labelledby':'wt'},
    h('img',{src:'/app-icon-final.png',alt:''}),h('h1',{id:'wt',text:'欢迎使用绿果TV'}),h('p',{class:'lead',text:'用手机选剧，电视上播放'}),
    h('p',{class:'notice',text:NOTICE+'继续使用即表示你已阅读并同意上述说明。'}),
    h('div',{class:'acts'},h('button',{class:'btn btn-primary btn-block',text:'同意并继续',onclick:()=>{try{localStorage.setItem('lvguo_usage_consent','1')}catch(_){}box.remove();Gate.enter(start)}}),
      h('button',{class:'plain',text:'不同意',onclick:e=>{e.target.textContent='需同意后才能使用，你也可以直接关闭页面'}})));
  document.body.append(box);
}
let consent=false;try{consent=localStorage.getItem('lvguo_usage_consent')==='1'}catch(_){}
if(consent)Gate.enter(start);else welcome();
</script>
