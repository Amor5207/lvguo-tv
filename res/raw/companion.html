<!doctype html>
<html lang="zh-CN">
<head>
<meta name="tv-session" content="__TV_SESSION__">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>绿果TV</title>
<link rel="icon" type="image/png" href="/app-icon-final.png">
<link rel="apple-touch-icon" href="/app-icon-final.png">
<script>
/* 首帧前决定主题，避免闪烁。mode: light | dark | system（默认浅色）。 */
(function(){var m='light';try{m=localStorage.getItem('lvguo.theme')||'light'}catch(e){}
if(m!=='dark'&&m!=='system')m='light';
var dark=m==='dark'||(m==='system'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
document.documentElement.setAttribute('data-theme',dark?'dark':'light');})();
</script>
<style>
/* ============================================================
   Design tokens — light is default, dark overrides.
   ============================================================ */
:root{
  --bg:#ffffff;--bg-rgb:255,255,255;--grouped:#f2f2f7;--surface:#ffffff;--raised:#f5f5f7;
  --fill:rgba(118,118,128,.12);--fill-2:rgba(118,118,128,.08);--fill-3:rgba(118,118,128,.2);
  --sep:rgba(60,60,67,.08);
  --t1:#0e0e11;--t2:#6c6c73;--t3:#a3a3ab;
  --accent:#1fa44f;--accent-ink:#ffffff;--accent-soft:rgba(31,164,79,.12);--accent-text:#168a41;
  --danger:#e5484d;
  --bar:rgba(255,255,255,.8);--bar-solid:rgba(249,249,251,.94);--bar-line:rgba(0,0,0,.06);
  --seg-on:#ffffff;--skeleton:rgba(118,118,128,.12);
  --shadow:0 12px 32px rgba(15,23,42,.14);--shadow-sm:0 2px 8px rgba(15,23,42,.08);
  --tab:calc(54px + env(safe-area-inset-bottom));
  --font:system-ui,sans-serif;   /* 不指定具体字体：用手机系统默认字体 */
  color-scheme:light;
}
[data-theme=dark]{
  --bg:#000000;--bg-rgb:0,0,0;--grouped:#000000;--surface:#1c1c1e;--raised:#141416;
  --fill:rgba(118,118,128,.24);--fill-2:rgba(118,118,128,.16);--fill-3:rgba(118,118,128,.32);
  --sep:rgba(235,235,245,.08);
  --t1:#f5f5f7;--t2:#98989f;--t3:#5e5e65;
  --accent:#a6e86a;--accent-ink:#0b1f0e;--accent-soft:rgba(166,232,106,.15);--accent-text:#a6e86a;
  --danger:#ff6961;
  --bar:rgba(22,22,24,.78);--bar-solid:rgba(36,36,38,.94);--bar-line:rgba(255,255,255,.06);
  --seg-on:#636366;--skeleton:rgba(118,118,128,.2);
  --shadow:0 12px 32px rgba(0,0,0,.55);--shadow-sm:0 2px 8px rgba(0,0,0,.4);
  color-scheme:dark;
}

/* ============================================================ Base */
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--t1);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;min-height:100dvh;overscroll-behavior-y:none}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
button:disabled{cursor:default;opacity:.4}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
img{display:block;max-width:100%}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}
.pressable{transition:transform .18s cubic-bezier(.2,.8,.2,1),opacity .18s}
.pressable:active{transform:scale(.97);opacity:.85}

/* ============================================================ Pages & nav */
#views{min-height:100dvh}
.page{min-height:100dvh;padding-bottom:calc(var(--tab) + 28px);position:relative}
body.has-mini .page{padding-bottom:calc(var(--tab) + 96px)}
.page.grouped{background:var(--grouped)}
.navbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;
  height:calc(48px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 10px 0;transition:background .25s,box-shadow .25s}
.navbar.scrolled{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--bar-line)}
.navbar .nav-title{position:absolute;left:64px;right:64px;bottom:0;height:48px;display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbar.scrolled .nav-title{opacity:1}
.navbar .spacer{flex:1}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--t1);flex:none}
.icon-btn.glass{background:rgba(var(--bg-rgb),.84);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:var(--shadow-sm)}
.navbar.scrolled .icon-btn.glass{background:transparent;box-shadow:none}
.text-btn{color:var(--accent-text);font-size:16px;padding:8px 10px;font-weight:500}
.large-title{font-size:32px;line-height:38px;font-weight:700;letter-spacing:-.022em;padding:2px 20px 14px}
.brand{display:flex;align-items:center;gap:8px;padding-left:10px}
.brand img{width:30px;height:30px}
.brand b{font-size:21px;font-weight:800;letter-spacing:-.02em}
.brand b span{color:var(--accent-text)}

/* ============================================================ Section headings */
.section{margin-top:30px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 20px 12px}
.section-head h2{font-size:21px;line-height:26px;font-weight:700;letter-spacing:-.014em}
.section-head .sub{font-size:13px;color:var(--t2);font-weight:400;margin-left:6px}
.section-head .link{color:var(--accent-text);font-size:15px;font-weight:500;white-space:nowrap}

/* ============================================================ Hero carousel */
.hero{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 20px 0;scrollbar-width:none;overscroll-behavior-x:contain}
.hero::-webkit-scrollbar,.rail::-webkit-scrollbar,.chips::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
.hero-card{position:relative;flex:0 0 84%;aspect-ratio:4/5;border-radius:22px;overflow:hidden;scroll-snap-align:center;background:var(--skeleton);cursor:pointer;isolation:isolate}
.hero-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%;opacity:0;transition:opacity .45s}
.hero-card img.ready{opacity:1}
.hero-card::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 38%,rgba(0,0,0,.28) 58%,rgba(0,0,0,.82) 100%);z-index:1}
.hero-card:empty::after{display:none}
.hero-info{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:0 20px 20px;color:#fff}
.hero-tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;letter-spacing:.04em;padding:4px 9px;border-radius:999px;
  background:rgba(0,0,0,.34);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.hero-tag .i{width:13px;height:13px}
.hero-title{text-wrap:pretty;font-size:26px;line-height:32px;font-weight:800;letter-spacing:-.02em;margin-top:10px;text-shadow:0 1px 12px rgba(0,0,0,.25);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero-meta{font-size:13px;color:rgba(255,255,255,.82);margin-top:6px}
.hero-actions{display:flex;gap:10px;margin-top:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 20px;border-radius:999px;font-size:16px;font-weight:600;white-space:nowrap}
.btn .i{width:20px;height:20px}
.btn-light{background:#fff;color:#0e0e11}
.btn-glass{background:rgba(0,0,0,.36);color:#fff;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-fill{background:var(--fill);color:var(--t1)}
.btn-block{display:flex;width:100%;height:50px;border-radius:14px;font-size:17px}
.dots{display:flex;justify-content:center;gap:6px;padding-top:12px;height:20px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--fill-3);transition:width .3s,background .3s}
.dots i.on{width:18px;background:var(--t1)}

/* ============================================================ Posters */
.rail{display:flex;align-items:flex-start;gap:12px;overflow-x:auto;padding:0 20px;scroll-snap-type:x proximity;scroll-padding:0 20px;scrollbar-width:none;overscroll-behavior-x:contain}
.rail>*{flex:0 0 calc((100% - 24px) / 3.25);scroll-snap-align:start;min-width:0}
.rail.rank>*{flex-basis:calc((100% - 12px) / 2.15)}
.tile{display:flex;flex-direction:column;justify-content:flex-start;width:100%;min-width:0;cursor:pointer}
.poster{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--skeleton)}
.poster img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s}
.poster img.ready{opacity:1}
.poster .badge{position:absolute;left:6px;top:6px;font-size:11px;font-weight:600;line-height:18px;padding:0 6px;border-radius:6px;background:var(--accent);color:var(--accent-ink)}
.poster .pbar{position:absolute;left:8px;right:8px;bottom:8px;height:3px;border-radius:2px;background:rgba(255,255,255,.38);overflow:hidden}
.poster .pbar i{display:block;height:100%;border-radius:2px;background:#fff}
.poster .shade{position:absolute;inset:auto 0 0 0;height:36%;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.tile-title{font-size:14px;line-height:19px;font-weight:500;margin-top:8px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.poster .count-badge{position:absolute;right:6px;bottom:6px;z-index:1;font-size:11px;font-weight:600;line-height:18px;padding:0 7px;border-radius:9px;background:rgba(0,0,0,.55);color:#fff;font-variant-numeric:tabular-nums}
.tile-meta{font-size:12px;line-height:16px;color:var(--t2);margin-top:3px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-art{position:relative;padding-left:34px}
.rank-num{position:absolute;left:-4px;bottom:-14px;z-index:0;font-size:96px;line-height:1;font-weight:800;letter-spacing:-.08em;font-style:italic;
  color:var(--bg);-webkit-text-stroke:2px var(--t3)}
.rank-art .poster{z-index:1}
.rank .tile-title,.rank .tile-meta{padding-left:34px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start;gap:22px 12px;padding:0 20px}
.sk-line{height:12px;border-radius:6px;background:var(--skeleton);margin-top:10px;width:86%}
.sk-line.short{width:48%;margin-top:6px}
.skeleton .poster{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.list-end{display:flex;flex-direction:column;align-items:center;gap:12px;padding:28px 20px 0;color:var(--t2);font-size:13px;text-align:center}
.list-end:empty{display:none}
.sentinel{height:1px}

/* ============================================================ Chips / tabs / segmented */
.tabs{display:flex;gap:22px;overflow-x:auto;padding:0 20px;scrollbar-width:none}
.tabs button{flex:none;font-size:17px;font-weight:600;color:var(--t3);padding:6px 0 8px;position:relative;white-space:nowrap}
.tabs button.on{color:var(--t1)}
.tabs button.on::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:2px;background:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 20px;scrollbar-width:none}
.chip{flex:none;height:30px;padding:0 13px;border-radius:15px;background:var(--fill-2);font-size:14px;white-space:nowrap;color:var(--t1)}
.chip.on{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.filter-group{display:flex;align-items:center;margin-top:6px}
.filter-group>span{flex:none;width:58px;padding-left:20px;font-size:13px;color:var(--t2)}
.filter-group .chips{padding-left:8px;flex:1;min-width:0}
.seg{display:flex;padding:2px;border-radius:10px;background:var(--fill)}
.seg button{flex:1;height:32px;border-radius:8px;font-size:14px;font-weight:500;color:var(--t1);transition:background .2s,box-shadow .2s;white-space:nowrap;padding:0 10px;text-align:center}
.seg button.on{background:var(--seg-on);box-shadow:0 2px 6px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);font-weight:600}

/* ============================================================ Tab bar & mini player */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;height:var(--tab);padding-bottom:env(safe-area-inset-bottom);
  background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);box-shadow:0 -.5px 0 var(--bar-line)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:500;color:var(--t3);padding-top:4px}
.tabbar button .i{width:25px;height:25px;stroke-width:1.7}
.tabbar button.on{color:var(--accent-text)}
.tabbar button.on .i{stroke-width:2.1}
.mini{position:fixed;left:10px;right:10px;bottom:calc(var(--tab) + 8px);z-index:39;height:62px;border-radius:16px;display:flex;align-items:center;gap:12px;padding:8px 6px 8px 8px;
  background:var(--bar-solid);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;
  transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .3s}
.mini.off{transform:translateY(140%);opacity:0;pointer-events:none}
.mini img{width:34px;height:46px;border-radius:7px;object-fit:cover;background:var(--skeleton)}
.mini-text{flex:1;min-width:0}
.mini-text strong{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-text small{display:block;font-size:12px;color:var(--t2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .icon-btn .i{width:26px;height:26px}
.mini-progress{position:absolute;left:0;bottom:0;height:2px;background:var(--accent);width:0;transition:width .9s linear}

/* ============================================================ Banners / toast / alerts */
.offline{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 8px);z-index:50;display:flex;align-items:center;gap:10px;
  padding:10px 8px 10px 14px;border-radius:14px;background:var(--bar-solid);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:var(--shadow);font-size:13px}
.offline{transform:translateY(calc(-100% - 24px));opacity:0;transition:transform .5s cubic-bezier(.32,1.25,.5,1),opacity .3s}
.offline.on{transform:none;opacity:1}
.tv-error{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin:16px 0 4px;padding:14px 14px 14px 16px;border-radius:18px;
  background:color-mix(in srgb,var(--danger) 10%,transparent)}
.tv-error[hidden]{display:none}
.tv-error.in{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
.tv-error-ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--danger);background:color-mix(in srgb,var(--danger) 14%,transparent)}
.tv-error-ic .i{width:20px;height:20px}
.tv-error strong{display:block;font-size:15px;font-weight:600}
.tv-error p{margin:2px 0 0;font-size:13px;line-height:1.4;color:var(--t2)}
.tv-error .btn{height:34px;padding:0 16px;font-size:14px}
@keyframes rise{from{opacity:0;transform:translateY(8px) scale(.98)}}
.offline .dot{width:8px;height:8px;border-radius:50%;background:var(--danger);flex:none}
.offline div{flex:1;min-width:0}
.offline strong{display:block;font-size:14px}
.offline small{color:var(--t2)}
.toast{position:fixed;left:50%;bottom:calc(var(--tab) + 86px);z-index:80;transform:translate(-50%,8px);max-width:calc(100% - 48px);
  padding:11px 18px;border-radius:999px;background:rgba(30,30,32,.92);color:#fff;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translate(-50%,0)}
dialog.alert{border:0;padding:0;margin:auto;width:min(300px,calc(100% - 64px));border-radius:16px;background:var(--bar-solid);color:var(--t1);
  -webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);box-shadow:var(--shadow);overflow:hidden;text-align:center}
dialog.alert::backdrop{background:rgba(0,0,0,.32)}
.alert-body{padding:20px 18px 16px}
.alert-body h3{font-size:17px;font-weight:600;line-height:22px}
.alert-body p{font-size:13px;line-height:18px;color:var(--t2);margin-top:6px}
.alert-actions{display:flex;border-top:.5px solid var(--sep)}
.alert-actions button{flex:1;height:46px;font-size:17px;color:var(--accent-text);text-align:center}
.alert-actions button+button{border-left:.5px solid var(--sep)}
.alert-actions button.strong{font-weight:600}
.alert-actions button.danger{color:var(--danger)}

/* ============================================================ Sheets */
.sheet-backdrop{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.32);opacity:0;transition:opacity .28s}
.sheet-backdrop.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;max-height:88dvh;display:flex;flex-direction:column;background:var(--surface);
  border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:none}
.sheet-grab{width:36px;height:5px;border-radius:3px;background:var(--fill-3);margin:8px auto 0;flex:none}
.sheet-head{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 20px;flex:none}
.sheet-head h3{flex:1;font-size:18px;font-weight:700}
.sheet-head small{font-size:13px;color:var(--t2);font-weight:400;margin-left:6px}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;padding:0 20px 20px;flex:1}
/* 时间设置：系统原生时间选择器（iOS / 安卓都是滚轮），可设任意时分 */
.time-sheet{display:grid;gap:14px;padding:6px 0 4px}
.time-sheet input{height:64px;border-radius:16px;background:var(--fill-2);border:1px solid var(--sep);color:var(--t1);font-size:30px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;width:100%}
.time-sheet input:focus{outline:none;border-color:var(--accent)}
.time-sheet .range-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:end;gap:8px}
.time-sheet .range-col{display:grid;gap:8px;min-width:0;font-size:13px;color:var(--t2);text-align:center}
.time-sheet .range-col input{min-width:0;font-size:20px;padding:0 6px}
.time-sheet .range-sep{font-size:24px;font-weight:700;color:var(--t2);line-height:64px}
.time-sheet .hint{font-size:13px;color:var(--t2);text-align:center;min-height:18px}
.time-sheet .hint.err{color:#e5484d}
.option{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;font-size:16px;border-bottom:.5px solid var(--sep);text-align:left}
.option:last-child{border-bottom:0}
.option span{flex:1}
.option>.i{color:var(--accent-text)}
.option .chev{color:var(--t3)}

/* ============================================================ Detail */
.detail-bg{position:absolute;left:0;right:0;top:0;height:460px;overflow:hidden;z-index:0;pointer-events:none}
.detail-bg img{width:100%;height:100%;object-fit:cover;filter:blur(40px) saturate(1.5);transform:scale(1.4);opacity:0;transition:opacity .6s}
.detail-bg img.ready{opacity:.55}
.detail-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(var(--bg-rgb),.15) 0%,rgba(var(--bg-rgb),.55) 55%,var(--bg) 100%)}
.detail-content{position:relative;z-index:1}
.detail-head{display:flex;gap:16px;padding:8px 20px 0;align-items:flex-end}
.detail-head .poster{width:122px;flex:none;border-radius:14px;box-shadow:var(--shadow)}
.detail-head .meta{flex:1;min-width:0;padding-bottom:4px}
.detail-head h1{text-wrap:pretty;font-size:23px;line-height:29px;font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{font-size:12px;line-height:22px;padding:0 8px;border-radius:6px;background:var(--fill);color:var(--t2);font-weight:500}
.pill.accent{background:var(--accent-soft);color:var(--accent-text)}
.intro{margin:18px 20px 0;font-size:14px;line-height:22px;color:var(--t2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.intro.open{-webkit-line-clamp:unset;display:block}
.sk-text{display:block;height:12px;border-radius:6px;background:var(--skeleton);margin:9px 0 0}
.detail-actions{padding:20px 20px 0;display:grid;gap:10px}
.detail-actions .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.detail-actions .btn-fill{height:46px;border-radius:14px;font-size:15px;font-weight:600}
.detail-actions .btn-fill.on{color:var(--accent-text);background:var(--accent-soft)}

/* ============================================================ Episodes */
.ep-tools{display:grid;gap:12px;margin-bottom:14px}
.ep-tools:has(>*:not([hidden]))>*{min-width:0}
.ep-tools .seg{margin:0 20px}
.ep-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:0 20px}
.ep{position:relative;height:48px;border-radius:12px;background:var(--fill-2);font-size:16px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--t1);text-align:center}
.ep.seen{color:var(--t2)}
.ep.current{background:var(--accent-soft);color:var(--accent-text);font-weight:700}
.ep.playing::after{content:'';position:absolute;right:7px;top:7px;width:9px;height:9px;
  background:linear-gradient(var(--accent-text),var(--accent-text)) 0 100%/2px 60% no-repeat,linear-gradient(var(--accent-text),var(--accent-text)) 3.5px 100%/2px 100% no-repeat,linear-gradient(var(--accent-text),var(--accent-text)) 7px 100%/2px 40% no-repeat;
  animation:eq .9s ease-in-out infinite alternate}
@keyframes eq{to{background-size:2px 30%,2px 55%,2px 100%}}
.ep-sk{height:48px;border-radius:12px;background:var(--skeleton)}

/* ============================================================ Remote (Now Playing) */
.remote-bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.remote-bg img{position:absolute;inset:-10%;width:120%;height:120%;max-width:none;object-fit:cover;filter:blur(60px) saturate(1.6);opacity:0;transition:opacity .8s}
.remote-bg img.ready{opacity:.6}
[data-theme=dark] .remote-bg img.ready{opacity:.5}
.remote-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(var(--bg-rgb),.2) 0%,rgba(var(--bg-rgb),.62) 48%,var(--bg) 78%)}
.remote-content{position:relative;z-index:1}
.now{max-width:440px;margin:0 auto;padding:6px 28px 0}
.now-art{width:min(62vw,270px);aspect-ratio:3/4;margin:6px auto 0;border-radius:18px;overflow:hidden;background:var(--skeleton);box-shadow:0 24px 48px rgba(0,0,0,.28);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.now-art.paused{transform:scale(.88)}
.now-art img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.now-art img.ready{opacity:1}
.now-head{display:flex;align-items:center;gap:12px;margin-top:28px}
.now-head>div{flex:1;min-width:0}
.now-head h2{font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now-head p{font-size:15px;color:var(--t2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--t1);flex:none}
.fav-btn.on{color:var(--accent-text);background:var(--accent-soft)}
.scrub{margin-top:20px}
.scrub input{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;display:block;margin:0;cursor:pointer;touch-action:pan-y}
.scrub input::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(var(--t1),var(--t1)) 0/var(--p,0%) 100% no-repeat,var(--fill-3)}
.scrub input::-moz-range-track{height:6px;border-radius:3px;background:var(--fill-3)}
.scrub input::-moz-range-progress{height:6px;border-radius:3px;background:var(--t1)}
.scrub input::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--t1);margin-top:-4px;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:transform .15s}
.scrub input:active::-webkit-slider-thumb{transform:scale(1.5)}
.scrub input::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--t1)}
.scrub .times{display:flex;justify-content:space-between;font-size:12px;color:var(--t2);font-variant-numeric:tabular-nums;margin-top:2px}
.transport{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.transport button{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:var(--t1);transition:transform .15s,background .15s}
.transport button:active{transform:scale(.9);background:var(--fill-2)}
.transport .i{width:30px;height:30px}
.transport .skip .i{width:28px;height:28px;stroke-width:1.7}
.transport .play{width:76px;height:76px;background:var(--t1);color:var(--bg)}
.transport .play:active{background:var(--t1)}
.transport .play .i{width:34px;height:34px}
.now-actions{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:22px}
.now-actions button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:11px 0 10px;border-radius:14px;background:var(--fill-2);font-size:11px;color:var(--t2);text-align:center}
.now-actions button b{font-size:14px;font-weight:600;color:var(--t1);line-height:18px}
.now-actions button .i{width:22px;height:22px;color:var(--t1);margin-bottom:2px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:72px 36px 0}
.empty .glyph{width:84px;height:84px;border-radius:24px;display:grid;place-items:center;background:var(--fill-2);color:var(--t2)}
.empty .glyph .i{width:40px;height:40px;stroke-width:1.5}
.empty h3{font-size:20px;font-weight:700;margin-top:20px}
.empty p{font-size:14px;line-height:21px;color:var(--t2);margin-top:8px;max-width:280px}
.empty .btn{margin-top:22px}

/* ============================================================ Me & settings */
.device{display:flex;align-items:center;gap:14px;margin:0 20px;padding:14px 14px 14px 16px;border-radius:18px;background:var(--raised);cursor:pointer;text-align:left}
[data-theme=dark] .device{background:var(--surface)}
.device .glyph{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text);flex:none}
.device .glyph.off{background:var(--fill);color:var(--t2)}
.device>div:not(.glyph){flex:1;min-width:0}
.device strong{display:block;font-size:16px;font-weight:600}
.device small{display:block;font-size:13px;color:var(--t2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.device .chev,.cell .chev{color:var(--t3);width:18px;height:18px}
.me-seg{display:flex;align-items:center;gap:8px;margin:22px 20px 14px}
.me-seg .seg{flex:1}
.group{margin:0 16px 30px}
.group-title{font-size:13px;color:var(--t2);padding:0 16px 7px}
.group-body{background:var(--surface);border-radius:14px;overflow:hidden}
.group-foot{font-size:12px;line-height:17px;color:var(--t2);padding:7px 16px 0}
.cell{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:0 16px;font-size:16px;text-align:left}
.cell+.cell::before{content:'';position:absolute;top:0;left:58px;right:0;height:.5px;background:var(--sep)}
/* 标题一行优先完整显示；右侧值过长时截断，不能把标题挤成竖排 */
.cell .label{flex:1 0 auto;white-space:nowrap}
.cell .value{flex:0 1 auto;min-width:0;color:var(--t2);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .danger-text{color:#ff3b30}
.cell-icon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.cell .cell-icon .i{width:18px;height:18px;stroke-width:2}
.switch{position:relative;width:51px;height:31px;border-radius:16px;background:var(--fill-3);transition:background .25s;flex:none}
.switch::after{content:'';position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.08);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.switch[aria-checked=true]{background:#34c759}
.switch[aria-checked=true]::after{transform:translateX(20px)}
.appearance{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:20px 12px 16px}
.appearance button{display:flex;flex-direction:column;align-items:center;gap:9px;font-size:14px;text-align:center}
.appearance .preview{width:64px;height:112px;border-radius:12px;overflow:hidden;position:relative;box-shadow:0 0 0 .5px var(--sep),var(--shadow-sm)}
.appearance .on .preview{box-shadow:0 0 0 2.5px var(--accent),var(--shadow-sm)}
.appearance .preview.light{background:#f2f2f7}
.appearance .preview.dark{background:#000}
.appearance .preview .half{position:absolute;inset:0;background:#000;clip-path:inset(0 0 0 50%)}
.appearance .preview i{position:absolute;left:8px;right:8px;height:9px;border-radius:3px}
.appearance .preview .a{top:12px;width:22px;right:auto;background:#34a853}
.appearance .preview .b{top:28px;height:34px}
.appearance .preview .c{top:68px}
.appearance .preview .d{top:82px;right:24px}
.appearance .light i:not(.a){background:#fff}
.appearance .dark i:not(.a){background:#2c2c2e}
.appearance .auto>i:not(.a){background:#fff}.appearance .auto .half i:not(.a){background:#2c2c2e}
.appearance .radio{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--t3);display:grid;place-items:center}
.appearance .on .radio{background:var(--accent);box-shadow:none;color:var(--accent-ink)}
.appearance .radio .i{width:14px;height:14px;stroke-width:3}

/* ============================================================ Search */
.search-bar{display:flex;align-items:center;flex:1;padding-left:10px;min-width:0}
.search-field{flex:1;display:flex;align-items:center;gap:6px;height:38px;padding:0 10px;border-radius:12px;background:var(--fill);min-width:0}
.search-field .i{width:18px;height:18px;color:var(--t2)}
.search-field input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px;height:100%}
.search-field input::placeholder{color:var(--t2)}
.search-field input::-webkit-search-cancel-button{display:none}
.recent{padding:8px 20px 0}
.recent-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.recent-head h3{font-size:17px;font-weight:700}
.recent-head button{font-size:14px;color:var(--t2)}
.recent .chips{padding:0;flex-wrap:wrap}

/* ============================================================ Comments */
.comment{display:flex;gap:12px;padding:16px 0;border-bottom:1px solid var(--sep)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;flex:none;color:#fff;position:relative;overflow:hidden}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.avatar img.ready{opacity:1}
.comment-main{flex:1;min-width:0}
.comment-top{display:flex;align-items:center;gap:8px}
.comment-top strong{font-size:13px;color:var(--t2);font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.comment-top span{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--t3)}
.comment-top .i{width:14px;height:14px}
.comment-text{font-size:15px;line-height:24px;margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere}
.comment-text img{display:inline-block;width:1.3em;height:1.3em;vertical-align:-.28em;margin:0 1px}
.comment-imgs{display:flex;gap:8px;margin-top:10px;overflow-x:auto}
.comment-imgs img{flex:none;width:80px;height:80px;border-radius:10px;object-fit:cover;background:var(--skeleton)}
.sheet .seg{margin-bottom:6px}

/* ============================================================ Welcome */
.welcome{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 12vh) 32px calc(28px + env(safe-area-inset-bottom));text-align:center;overflow:auto}
.welcome img{width:96px;height:96px;border-radius:24px;box-shadow:var(--shadow)}
.welcome h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:26px}
.welcome .lead{font-size:16px;color:var(--t2);margin-top:8px}
.welcome .notice{font-size:13px;line-height:20px;color:var(--t2);margin-top:28px;text-align:left;background:var(--fill-2);padding:14px 16px;border-radius:14px;max-width:360px}
.welcome .acts{width:100%;max-width:360px;margin-top:auto;display:grid;gap:6px;padding-top:28px}
.welcome .acts .plain{height:44px;color:var(--t2);font-size:15px;text-align:center}
/* 门禁页：遥控关闭 / 需要密码 / 电视强制休息 */
.gate{position:fixed;inset:0;z-index:95;background:var(--bg);display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 14vh) 32px calc(28px + env(safe-area-inset-bottom));text-align:center;overflow:auto}
.gate .ic{width:52px;height:52px;color:var(--t2);stroke-width:1.5}
.gate h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:24px}
.gate .lead{font-size:15px;line-height:22px;color:var(--t2);margin-top:10px;max-width:320px;text-wrap:balance}
.gate form{width:100%;max-width:320px;margin-top:30px;display:grid;gap:12px}
.gate input{height:52px;border-radius:14px;background:var(--fill-2);border:1px solid var(--sep);color:var(--t1);font-size:24px;letter-spacing:.5em;text-align:center;padding:0 12px}
.gate input:focus{outline:none;border-color:var(--accent)}
.gate .err{min-height:20px;font-size:13px;color:#e5484d}
.gate.night{background:linear-gradient(#0b1022,#05070d);color:#edeff7}
.gate.night .ic{color:#f4e6be}
.gate.night .lead{color:rgba(237,239,247,.7)}

/* ============================================================ Wide screens */
@media(min-width:700px){
  .grid,.section-head,.chips,.tabs,.rail,.hero,.large-title,.recent,.filter-group,.ep-grid{max-width:1080px;margin-left:auto;margin-right:auto}
  .hero-card{flex-basis:calc((100% - 24px)/3)}
  .grid{grid-template-columns:repeat(5,minmax(0,1fr))}
  .rail>*{flex-basis:calc((100% - 60px)/6)}
  .rail.rank>*{flex-basis:calc((100% - 36px)/4)}
  .ep-grid{grid-template-columns:repeat(10,minmax(0,1fr))}
  .mini{left:50%;right:auto;width:min(560px,calc(100% - 40px));transform:translateX(-50%)}
  .mini.off{transform:translate(-50%,140%)}
  .sheet{left:50%;right:auto;width:560px;transform:translate(-50%,105%)}
  .sheet.on{transform:translate(-50%,0)}
  .group,.device,.me-seg,.detail-content,.ep-tools{max-width:760px;margin-left:auto;margin-right:auto}
}

/* ============================================================
   Liquid Glass（iOS 26 设计语言）
   只用于浮在内容之上的控件层：Tab、迷你播放条、导航按钮、分段控件、弹层、提示；内容本身不上玻璃。
   与毛玻璃的区别：更通透（低模糊）、边缘有折射透镜（JS 生成位移贴图，Chromium 生效）、
   高光描边 + 内阴影表现厚度、选中气泡会流动。
   ============================================================ */
:root{
  --glass:rgba(255,255,255,.78);--glass-bar:rgba(255,255,255,.82);--glass-dock:rgba(255,255,255,.9);--glass-strong:rgba(252,252,253,.92);--glass-sheet:rgba(250,250,252,.96);
  --glass-media:rgba(255,255,255,.5);--glass-lens:rgba(255,255,255,.82);
  --glass-rim:rgba(255,255,255,1);--glass-rim-2:rgba(255,255,255,.28);
  --glass-blur:blur(20px) saturate(160%);
  --glass-shadow:0 10px 30px rgba(16,24,40,.12),0 1px 3px rgba(16,24,40,.08);
  --glass-inner:inset 0 1px 1.5px rgba(255,255,255,.9),inset 0 -1px 1.5px rgba(255,255,255,.35),inset 0 0 14px rgba(255,255,255,.28);
  --tab-h:64px;--g:20px;
}
[data-theme=dark]{
  --glass:rgba(40,40,44,.78);--glass-bar:rgba(22,22,26,.82);--glass-dock:rgba(18,18,22,.9);--glass-strong:rgba(36,36,40,.92);--glass-sheet:rgba(28,28,32,.96);
  --glass-media:rgba(40,40,44,.55);--glass-lens:rgba(255,255,255,.18);
  --glass-rim:rgba(255,255,255,.42);--glass-rim-2:rgba(255,255,255,.06);
  --glass-blur:blur(20px) saturate(150%);
  --glass-shadow:0 10px 30px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.3);
  --glass-inner:inset 0 1px 1.5px rgba(255,255,255,.22),inset 0 -1px 1.5px rgba(255,255,255,.06),inset 0 0 14px rgba(255,255,255,.05);
}
body{--tab:calc(var(--tab-h) + 14px + env(safe-area-inset-bottom))}
body.compact{--tab-h:52px}

/* 材质。注意优先级：:is() 取列表中最高者，按「单类 / 双类」分开写，后面的单组件覆盖才生效。 */
:is(.tabbar,.mini,.hero-tag,.btn-glass,.sheet,.toast,.offline,.fav-btn,.tab-lens){
  background:var(--glass);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:var(--glass-shadow),var(--glass-inner)}
:is(.icon-btn.glass,.seg button.on,.detail-actions .btn-fill){
  background:var(--glass);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:var(--glass-shadow),var(--glass-inner);position:relative}
dialog.alert{box-shadow:var(--glass-shadow),var(--glass-inner)}
:is(.hero-tag,.btn-glass,.fav-btn){position:relative}
/* 高光描边：左上最亮、右下次亮，中段透明——模拟光线在玻璃厚边上的反射 */
.tabbar::before,.mini::before,.hero-tag::before,.btn-glass::before,.sheet::before,.toast::before,.offline::before,.fav-btn::before,.tab-lens::before,
.icon-btn.glass::before,.seg button.on::before,.detail-actions .btn-fill::before,dialog.alert::before{
  content:'';position:absolute;inset:0;border-radius:inherit;padding:1.2px;pointer-events:none;z-index:1;
  background:linear-gradient(135deg,var(--glass-rim) 0%,var(--glass-rim-2) 28%,transparent 46%,transparent 58%,var(--glass-rim-2) 76%,var(--glass-rim) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
/* 压在照片上的玻璃：几乎全透，只靠折射与高光 */
:is(.hero-tag,.btn-glass){background:var(--glass-media);box-shadow:inset 0 1px 1.5px rgba(255,255,255,.55),inset 0 0 12px rgba(255,255,255,.14),0 6px 18px rgba(0,0,0,.2)}
.hero-tag::before,.btn-glass::before{background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(255,255,255,.18) 30%,transparent 50%,rgba(255,255,255,.16) 72%,rgba(255,255,255,.7))}
:is(.btn-glass,.navbar .icon-btn,.now-actions button,.fav-btn,.detail-actions .btn-fill){transition:transform .35s cubic-bezier(.3,1.5,.5,1),filter .2s}
:is(.btn-glass,.navbar .icon-btn,.now-actions button,.fav-btn,.detail-actions .btn-fill):active{transform:scale(1.07);filter:brightness(1.08)}
/* 顶栏是固定的毛玻璃条：栏内按钮只留图标，不再套圆形玻璃底（无固定顶栏的悬浮按钮才需要） */
.navbar .icon-btn,.navbar .icon-btn.glass,.navbar.scrolled .icon-btn.glass{background:transparent!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.navbar .icon-btn::before{display:none!important}
.navbar .icon-btn:active{transform:none;filter:none;opacity:.5}

/* ---------- 底部：一整块通栏液态玻璃（迷你播放条 + Tab 同一个表面），文字常显。
   顶边有折射与高光，选中 Tab 后面是一颗玻璃透镜。 */
/* 大圆角屏：很多安卓浏览器 safe-area-inset-bottom 为 0，tab 会落进屏幕圆角——底部至少留 10px，左右多留边 */
body{--tab:calc(56px + max(env(safe-area-inset-bottom),10px))}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;flex-direction:column;
  background:var(--glass-dock);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
  box-shadow:0 -10px 30px rgba(16,24,40,.08),inset 0 1px 0 var(--glass-rim),inset 0 2px 6px rgba(255,255,255,.18)}
.dock::before{content:'';position:absolute;left:0;right:0;top:0;height:1px;pointer-events:none;z-index:3;
  background:linear-gradient(90deg,transparent,var(--glass-rim) 18%,var(--glass-rim) 82%,transparent)}
[data-theme=dark] .dock{box-shadow:0 -10px 30px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.14)}
.dock .tabbar,.dock .mini{position:relative;left:auto;right:auto;bottom:auto;transform:none;border-radius:0;background:none;
  -webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none;z-index:1}
.dock .tabbar::before,.dock .mini::before{display:none}
.dock .tabbar{height:var(--tab);padding:0 max(18px,env(safe-area-inset-left)) max(env(safe-area-inset-bottom),10px) max(18px,env(safe-area-inset-right));display:flex}
.tabbar button{position:relative;z-index:3;color:var(--t2);gap:3px;padding-top:2px;border-radius:16px}
.tabbar button .i{width:24px;height:24px}
.tabbar button span{font-size:10px;font-weight:500;opacity:1;max-height:none}
.tabbar button.on{color:var(--accent-text)}
.tabbar button.on span{font-weight:600}
.tab-lens{display:block;position:absolute;top:5px;height:46px;left:0;width:0;border-radius:18px;z-index:2;pointer-events:none;
  background:var(--glass-lens);box-shadow:inset 0 1px 1px rgba(255,255,255,.7),inset 0 -1px 1px rgba(255,255,255,.25),0 2px 8px rgba(16,24,40,.08);
  transform:translateX(var(--x,0)) scale(var(--s,1));transition:transform .55s cubic-bezier(.32,1.45,.5,1),width .45s cubic-bezier(.32,1.3,.5,1)}
[data-theme=dark] .tab-lens{box-shadow:inset 0 1px 1px rgba(255,255,255,.18),0 2px 8px rgba(0,0,0,.3)}
.tabbar.pressing .tab-lens{--s:1.08}
.dock .mini{height:62px;padding:0 10px 0 16px;gap:12px;overflow:hidden;box-shadow:inset 0 -.5px 0 var(--bar-line);
  transition:height .35s cubic-bezier(.2,.8,.2,1),opacity .25s}
.dock .mini.off{height:0;opacity:0;pointer-events:none;transform:none}
.mini img{width:42px;height:42px;border-radius:10px}
.mini>*{position:relative;z-index:2}
.mini-play{position:relative;width:44px;height:44px}
.mini-play .ring{position:absolute;inset:0;width:44px;height:44px;transform:rotate(-90deg);fill:none;stroke-width:2.4}
.mini-play .ring circle:first-child{stroke:var(--fill-3)}
.mini-play .ring circle:last-child{stroke:var(--t1);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.mini-play span{display:grid;place-items:center}
.mini-play span .i{width:20px;height:20px}
.mini #miniNext .i{width:24px;height:24px}
body.has-mini .page{padding-bottom:calc(var(--tab) + 86px)}
/* ---------- 顶栏：固定高度的毛玻璃，常显、不渐隐；与内容同一条 20px 边线 */
.navbar{height:calc(52px + env(safe-area-inset-top));padding:env(safe-area-inset-top) var(--g) 0;gap:10px;
  background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);box-shadow:0 .5px 0 var(--bar-line)}
.navbar .nav-title{height:52px;opacity:1}
.navbar.scrolled{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);box-shadow:0 .5px 0 var(--bar-line)}
.navbar::after{display:none}
/* 首页搜索图标离屏幕右缘保持与品牌标记相近的视觉边距。 */
.page.home>.navbar{padding-right:10px}
/* 顶栏与底部导航同一种液态玻璃材质（常显，不随滚动变化）：同样的玻璃底色、模糊和高光边 */
.navbar,.navbar.scrolled{background:var(--glass-dock);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
  box-shadow:0 10px 30px rgba(16,24,40,.08),inset 0 -1px 0 var(--glass-rim),inset 0 -2px 6px rgba(255,255,255,.12)}
[data-theme=dark] .navbar,[data-theme=dark] .navbar.scrolled{box-shadow:0 10px 30px rgba(0,0,0,.4),inset 0 -1px 0 rgba(255,255,255,.14)}
.navbar .bar-title{margin:0;font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.02em;color:var(--t1)}
.page>.navbar+*{margin-top:14px}
.navbar .icon-btn{width:42px;height:42px}
.navbar .icon-btn .i{position:relative;z-index:2;width:21px;height:21px}
.navbar .icon-btn.glass,.navbar.scrolled .icon-btn.glass{background:transparent;box-shadow:none}
.navbar .nav-title{left:76px;right:76px}
.brand{padding-left:0}
.large-title{padding:4px var(--g) 18px}
.search-bar{padding-left:0}
.navbar .text-btn{padding-right:0}

/* ---------- 统一边距 */
.section-head,.tabs,.chips,.rail,.grid,.ep-grid,.hero{padding-left:var(--g);padding-right:var(--g)}
.hero{scroll-padding:0 var(--g);padding-top:16px}
/* 详情头：顶部对齐，标题/标签/简介在海报右侧一栏里填满海报高度 */
.detail-head{align-items:flex-start;padding-top:12px}
.detail-head .meta{padding-bottom:0;display:flex;flex-direction:column;min-height:163px}
.detail-head h1{font-size:22px;line-height:28px}
.detail-head .meta .intro{margin:10px 0 0;padding:0;font-size:13px;line-height:20px;-webkit-line-clamp:3}
.detail-head .meta .intro.open{-webkit-line-clamp:unset}
.rail{scroll-padding:0 var(--g)}
.device,.me-seg{margin-left:var(--g);margin-right:var(--g)}
/* 电视连接卡：占满两侧边距之间的宽度（button 默认按内容收缩，所以要显式给宽度） */
.device{width:calc(100% - 2 * var(--g));box-sizing:border-box;margin-top:4px}
/* 列表头：左边数量，右边清空——和分段控件分开，不再挤在 tab 后面 */
.list-head{display:flex;align-items:center;justify-content:space-between;margin:0 var(--g) 10px;min-height:32px}
.list-head small{font-size:13px;color:var(--t2)}
.list-head .text-btn{font-size:14px;color:var(--danger);padding:6px 0}
.group{margin:0 var(--g) 32px}
.group-title{padding:0 16px 8px}
.me-seg .text-btn{padding:8px 4px}
.detail-head,.intro{padding-left:var(--g);padding-right:var(--g)}
.intro{margin:18px 0 0}
.detail-actions{padding:20px var(--g) 0}
.ep-tools .seg{margin:0 var(--g)}
.filter-group>span{padding-left:var(--g)}

/* ---------- 分段控件：玻璃滑块 */
.seg{background:var(--fill-2);border-radius:999px;padding:3px}
.seg button{border-radius:999px;height:40px;font-size:15px;z-index:0}
.seg button.on{background:var(--glass-strong)}
.seg button.on>*{position:relative;z-index:2}

/* ---------- 弹层：离边悬浮的大圆角玻璃（长文本用更磨砂、低饱和的版本保证可读） */
.sheet{left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));border-radius:34px;padding-bottom:6px;background:var(--glass-sheet);
  -webkit-backdrop-filter:blur(36px) saturate(115%);backdrop-filter:blur(36px) saturate(115%);transform:translateY(calc(100% + 40px))}
.sheet>*{position:relative;z-index:2}
.sheet-head{padding:12px 14px 10px 22px}
.sheet-body{padding:0 22px 22px}
.sheet-backdrop{background:rgba(0,0,0,.2)}
dialog.alert{border-radius:30px;background:var(--glass-sheet);-webkit-backdrop-filter:blur(36px) saturate(115%);backdrop-filter:blur(36px) saturate(115%)}
dialog.alert>*{position:relative;z-index:2}
.alert-body{padding:22px 20px 18px}
.alert-actions{border-top:0;gap:10px;padding:0 16px 16px}
.alert-actions button{height:48px;border-radius:999px;background:var(--fill)}
.alert-actions button+button{border-left:0}
.alert-actions button.strong{background:var(--accent);color:var(--accent-ink)}
.alert-actions button.danger.strong{background:var(--danger);color:#fff}
.toast{background:var(--glass-strong);color:var(--t1);bottom:calc(var(--tab) + 76px);padding:12px 20px}
.offline{border-radius:26px;padding:10px 10px 10px 18px;left:var(--g);right:var(--g)}
.offline>*{position:relative;z-index:2}

/* ---------- 遥控页：玻璃功能块 + Apple Music 式进度条（无滑块、触摸变粗） */
.now{padding:6px 24px 0}
/* 遥控页播放控制下方：纯图标 + 文字的工具条，不做卡片（和上方控制同一层级，靠一条细分隔线区分） */
.now-actions{gap:0;margin-top:26px;padding-top:18px;border-top:.5px solid var(--sep)}
.now-actions{grid-template-columns:repeat(4,1fr)}
.now-actions button{gap:6px;font-size:0}
.now-actions button b{font-size:13px;font-weight:500;color:var(--t2)}
.now-actions button .i{width:24px;height:24px}
/* 顶部：小封面 + 信息 */
.now-top{display:flex;gap:16px;align-items:flex-start;margin-top:10px}
.now-art-btn{flex:none;padding:0;border-radius:14px}
/* 整页铺满一屏：信息在上、控制居中、工具条贴底，不再上挤下空 */
/* 遥控页正好一屏：控制区贴底；中间的「本集热议」可伸缩，空间不够时少显示，绝不把控制区挤到底栏下面 */
.remote .now{display:flex;flex-direction:column;height:calc(100dvh - 52px - env(safe-area-inset-top) - var(--tab) - 40px);overflow:hidden}
.remote .now>*{flex:none}
.remote .now>.cmt-wrap{flex:1 1 auto;min-height:0;overflow:hidden}
/* 搜索：热搜榜与联想 */
.hot-search{padding:0 var(--g);margin-top:22px}
.hot-swap{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--t2)}
.hot-swap .i{width:15px;height:15px}
.hot-list{list-style:none;margin:6px 0 0;padding:0}
.hot-list button{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;text-align:left;border-bottom:.5px solid var(--sep)}
.hot-rank{flex:none;width:20px;font-size:15px;font-weight:700;color:var(--t3);font-variant-numeric:tabular-nums;text-align:center}
.hot-rank.top{color:var(--accent-text)}
.hot-title{flex:1;min-width:0;font-size:15px;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hot-list small{flex:none;font-size:12px;color:var(--t3)}
.suggest{padding:4px var(--g) 0}
.sug-row{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;font-size:16px;color:var(--t1);text-align:left;border-bottom:.5px solid var(--sep)}
.sug-row .i{width:17px;height:17px;color:var(--t3);flex:none}
.sug-row span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug-row mark{background:none;color:var(--accent-text);font-weight:600}
.ep-strip-wrap{margin-top:26px}
.ep-strip-head{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--t3)}
.ep-strip-head b{font-size:16px;color:var(--t1);font-weight:600}
.ep-strip-all{margin-left:auto;display:flex;align-items:center;gap:2px;font-size:13px;color:var(--t2)}
.ep-strip-all .i{width:14px;height:14px}
.ep-strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:10px -24px 0;padding:0 24px}
.ep-strip::-webkit-scrollbar{display:none}
.ep-chip{flex:none;min-width:52px;height:44px;padding:0 10px;border-radius:12px;background:var(--fill-2);font-size:15px;font-weight:500;color:var(--t1);font-variant-numeric:tabular-nums}
.ep-chip.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.now-bottom{margin-top:auto;padding-top:20px}
.now-bottom .now-actions{margin-top:0;padding-top:0;border-top:0;margin-bottom:18px}
.now-bottom .transport{margin-top:6px}
.cmt-wrap{margin-top:22px;padding-top:16px;border-top:.5px solid var(--sep)}
.cmt-wrap .ep-strip-head{width:100%;text-align:left}
.cmt-preview{margin-top:8px}
.cmt-row{display:flex;gap:10px;padding:10px 0}
.cmt-row+.cmt-row{border-top:.5px solid var(--sep)}
.cmt-row>div{min-width:0;flex:1}
.cmt-row .avatar{width:28px;height:28px;font-size:12px;flex:none}
.cmt-row strong{display:block;font-size:12px;font-weight:500;color:var(--t3)}
.cmt-row p{margin:2px 0 0;font-size:14px;line-height:20px;color:var(--t1);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cmt-row p img{display:inline-block;width:18px;height:18px;vertical-align:-4px;margin:0 1px}
.now-top .now-art{width:120px;margin:0;border-radius:14px;box-shadow:0 10px 24px rgba(0,0,0,.2)}
.now-top .now-art.paused{transform:scale(.94)}
.now-info{flex:1;min-width:0}
.now-info .now-head{margin-top:0;align-items:flex-start}
.now-info .now-head h2{font-size:19px;line-height:25px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.now-info .now-head p{font-size:13px;margin-top:4px}
.now-info .fav-btn{width:38px;height:38px;flex:none}
.option .opt-val{flex:0 0 auto;margin-left:auto;margin-right:4px;color:var(--t3);text-align:right;white-space:nowrap}
.now-meta{font-size:12px;color:var(--t3);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now-meta:empty,.now-intro:empty{display:none}
.now-intro{font-size:13px;line-height:19px;color:var(--t2);margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.now .scrub{margin-top:0}
.now-actions button{border-radius:12px;background:transparent!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;padding:6px 0}
.now-actions button::before{display:none!important}
.now-actions button:active{transform:none;filter:none;opacity:.5}
.now-actions button>*{position:relative;z-index:2}
.fav-btn{background:var(--glass)}
.fav-btn.on{color:var(--accent-text)}
.fav-btn .i{position:relative;z-index:2}

.detail-actions .btn-fill.on{color:var(--accent-text)}
.detail-actions .btn-fill>*{position:relative;z-index:2}
.scrub{margin-top:24px}

.scrub input::-webkit-slider-runnable-track{height:7px;border-radius:4px;background:linear-gradient(var(--t1),var(--t1)) 0/var(--p,0%) 100% no-repeat,var(--fill-3);transition:height .2s}
.scrub input:active::-webkit-slider-runnable-track{height:12px;border-radius:6px}
.scrub input::-webkit-slider-thumb{width:0;height:7px;margin-top:0;box-shadow:none;background:transparent}
.scrub input::-moz-range-thumb{width:0;height:0;border:0;background:transparent}
.scrub input::-moz-range-track{height:7px;border-radius:4px}

@media(min-width:700px){
  .sheet{left:50%;right:auto;width:560px;bottom:20px;transform:translate(-50%,calc(100% + 40px))}
  .sheet.on{transform:translate(-50%,0)}
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  :root{--glass:rgba(248,248,250,.96);--glass-bar:rgba(248,248,250,.96);--glass-strong:rgba(248,248,250,.98)}
  [data-theme=dark]{--glass:rgba(40,40,44,.96);--glass-bar:rgba(40,40,44,.96);--glass-strong:rgba(36,36,40,.98)}
}
/* ============================================================ Page transitions */
#dock{view-transition-name:dock}
/* 提示条/离线条只在显示时才单独成层：隐藏时它们是透明但带毛玻璃的矩形，
   被转场截成快照就会在迷你条上方闪出一块模糊方块。 */
#toast.on{view-transition-name:toast}
#offline.on{view-transition-name:offline}
/* 固定层不参与淡入淡出：直接显示实时的新状态（避免 Tab 透镜出现两个残影） */
::view-transition-old(dock),::view-transition-old(toast),::view-transition-old(offline){display:none}
::view-transition-new(dock),::view-transition-new(toast),::view-transition-new(offline){animation:none}
::view-transition-old(root),::view-transition-new(root){animation-duration:.42s;animation-timing-function:cubic-bezier(.2,.8,.2,1);mix-blend-mode:normal}
html[data-nav=push]::view-transition-old(root){animation-name:vt-shift-left}
html[data-nav=push]::view-transition-new(root){animation-name:vt-from-right;box-shadow:-12px 0 32px rgba(0,0,0,.12)}
html[data-nav=pop]::view-transition-old(root){animation-name:vt-to-right;z-index:2;box-shadow:-12px 0 32px rgba(0,0,0,.12)}
html[data-nav=pop]::view-transition-new(root){animation-name:vt-from-left}
html[data-nav=tab]::view-transition-old(root){animation:vt-fade-out .16s ease-out both}
html[data-nav=tab]::view-transition-new(root){animation:vt-fade-in .24s ease-out both}
@keyframes vt-from-right{from{transform:translateX(100%)}}
@keyframes vt-shift-left{to{transform:translateX(-28%);filter:brightness(.94)}}
@keyframes vt-to-right{to{transform:translateX(100%)}}
@keyframes vt-from-left{from{transform:translateX(-28%);filter:brightness(.94)}}
@keyframes vt-fade-out{to{opacity:0}}
@keyframes vt-fade-in{from{opacity:0;transform:translateY(6px)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ===== 第15轮：现代化 ===== */
/* 顶栏：固定的毛玻璃条（与底部导航同一材质），不渐隐 */
.navbar,.navbar.scrolled{background:var(--glass-dock)!important;-webkit-backdrop-filter:var(--glass-blur)!important;backdrop-filter:var(--glass-blur)!important;box-shadow:0 .5px 0 var(--bar-line)!important}
.navbar::before,.navbar::after{display:none!important}
/* 去掉复古的细分割线，统一用留白区分 */
.cell+.cell::before{display:none!important}
.option,.hot-list button,.sug-row{border-bottom:0!important}
.cmt-row+.cmt-row,.cmt-wrap,.now-actions,.alert-actions{border-top:0!important}
/* 设置：无图标、无分割线的大圆角分组 */
.page.grouped .group-body{border-radius:18px}
.page.grouped .cell{min-height:56px;padding:0 18px}
.page.grouped .cell-icon{display:none!important}
.page.grouped .group-title{font-size:13px;font-weight:600;color:var(--t2);padding:0 18px 8px}
/* 我的：资料头 */
.me-profile{display:flex;align-items:center;gap:14px;padding:6px var(--g) 0}
.me-profile .avatar{width:64px;height:64px;font-size:24px}
.me-profile .avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.me-profile .avatar img.ready{opacity:1}
.me-profile h2{font-size:22px;font-weight:700;margin:0}
.me-profile p{font-size:13px;color:var(--t2);margin:3px 0 0}

/* 遥控页中部：追剧进度 + 简介 */
.remote .now>.now-desc{flex:1 1 auto;min-height:0;overflow:hidden;margin-top:26px;-webkit-mask-image:linear-gradient(180deg,#000 78%,transparent);mask-image:linear-gradient(180deg,#000 78%,transparent)}
.desc-progress{font-size:13px;color:var(--t2)}
.sheet-hint{font-size:13px;color:var(--t2);margin:0 0 8px}
.desc-progress b{font-size:17px;color:var(--t1);font-weight:700;margin:0 1px}
.desc-bar{height:4px;border-radius:2px;background:var(--fill);margin-top:8px;overflow:hidden}
.desc-bar i{display:block;height:100%;border-radius:2px;background:var(--accent);transition:width .4s}
.now-desc h4{font-size:15px;font-weight:600;margin:22px 0 6px;color:var(--t1)}
.now-desc p{font-size:14px;line-height:22px;color:var(--t2);margin:0}
.now-top .now-info .now-meta{margin-top:10px}
/* 搜索：最近搜索、大家在搜、联想都不要分割线 */
.hot-list button,.sug-row,.recent,.hot-search{border:0!important;box-shadow:none!important}
.hot-list li+li button,.sug-row+.sug-row{border-top:0!important}

/* 遥控页专辑旁信息 */
.now-info .now-head h2{font-size:20px;line-height:26px}
.now-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.now-tags:empty,.now-cast:empty{display:none}
.now-tags .tag{font-size:11px;font-weight:600;line-height:20px;padding:0 8px;border-radius:10px;background:var(--fill);color:var(--t2)}
.now-tags .tag.hot{background:rgba(255,69,58,.14);color:#ff453a}
.now-tags .tag.free{background:var(--accent-soft);color:var(--accent-text)}
.now-cast{font-size:12px;color:var(--t3);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now-top .now-art{width:128px}
.remote .now-actions{grid-template-columns:repeat(5,1fr)}
.remote .now>.now-desc{margin-top:22px}
.now-desc p{font-size:15px;line-height:24px}

.sug-row.hist span{color:var(--t2)}

/* 遥控工具条图标：统一尺寸与线宽 */
.remote .now-actions button .i{width:24px;height:24px;stroke-width:1.6;color:var(--t1)}
.remote .now-actions button b{font-size:12px;font-weight:500;color:var(--t2);margin-top:2px}
.remote .now-actions .now-fav-action.on,.remote .now-actions .now-fav-action.on .i{color:var(--accent-text)}
/* 剧情简介可上下滑动（底部柔和渐隐，滑到底时完整显示） */
.remote .now>.now-desc{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:28px}
.remote .now>.now-desc::-webkit-scrollbar{display:none}

/* 设置二级面板（手机）：总量大字 + 信息块 + 整宽按钮 */

.ds-head b{display:block;font-size:30px;font-weight:700;letter-spacing:-.02em;color:var(--t1)}
.ds-head small{display:block;font-size:13px;color:var(--t2);margin-top:4px}
.ds-facts{margin-top:18px;border-radius:14px;background:var(--fill-2);padding:2px 16px}
.ds-facts>div{display:flex;justify-content:space-between;align-items:center;min-height:46px;font-size:15px}
.ds-facts>div+div{border-top:.5px solid rgba(60,60,67,.08)}
[data-theme=dark] .ds-facts>div+div{border-top-color:rgba(235,235,245,.07)}
.ds-facts span{color:var(--t2)}
.ds-facts strong{max-width:72%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;font-weight:600;color:var(--t1)}
.ds-action{display:flex;align-items:center;justify-content:center;text-align:center;width:100%;height:50px;margin-top:18px;border-radius:14px;background:var(--fill);font-size:16px;font-weight:600;color:var(--t1)}
.ds-action.danger{color:#ff3b30}

.sheet.sheet-fixed{height:min(78dvh,640px)}
.sheet.sheet-fixed.comment-sheet{height:min(82dvh,660px)}
.sheet.sheet-fixed .sheet-body{flex:1;min-height:0;overflow-y:auto}

/* 选集（遥控弹层）：当前集实心主题色，看过的变淡，季 / 范围固定在顶部 */
.ep-compact{margin-top:0}
.ep-compact .ep-tools{position:sticky;top:0;z-index:2;background:var(--glass-sheet);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);padding:6px 0 12px;margin:0 0 4px}
.ep-compact .ep-tools .seg{display:flex;align-items:center;flex-wrap:nowrap;margin:0;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;touch-action:pan-x;scrollbar-width:none}
.ep-compact .ep-tools .ep-season-tabs{margin:0 -10px}
.ep-compact .ep-tools .ep-season-tabs>.seg{flex:1;min-width:0}
.ep-compact .ep-tools .seg::-webkit-scrollbar{display:none}
.ep-compact .ep-tools .seg button{flex:1 0 72px;min-width:72px;height:40px;padding:0 12px;white-space:nowrap}
.ep-compact .ep-tools .chips{margin:0;padding:0}
.ep-compact .ep-grid{padding:2px 0 16px;gap:10px;grid-template-columns:repeat(auto-fit,minmax(52px,1fr))}
.ep{height:52px;border-radius:14px;font-size:17px}
.ep.seen{color:var(--t3)}
.ep.current{background:var(--accent);color:var(--accent-ink)}
.ep.playing::after{background:linear-gradient(currentColor,currentColor) 0 100%/2px 60% no-repeat,linear-gradient(currentColor,currentColor) 3.5px 100%/2px 100% no-repeat,linear-gradient(currentColor,currentColor) 7px 100%/2px 40% no-repeat}

/* 选项卡固定在顶栏下方（和顶栏同一种毛玻璃底） */
.sticky-bar{position:sticky;top:calc(52px + env(safe-area-inset-top));z-index:15;background:var(--glass-dock);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);padding:8px 0 6px}
.page>.navbar+.sticky-bar{margin-top:0}
.filter-bar{padding:8px 0 6px}
/* 吸顶条用页面底色（半透明 + 模糊），不和页面形成一条色带 */
.sticky-bar{background:rgba(var(--bg-rgb),.9)!important}
/* 遥控页：集数/评分、主演在模糊海报上要看得清 */
.remote .now-meta,.remote .now-cast{color:var(--t2)}
/* 遥控页顶栏不要背景，直接压在模糊海报上 */
.remote .navbar,.remote .navbar.scrolled{background:transparent!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;box-shadow:none!important;border-bottom:0!important}
/* 进度放在主演下方 */
.now-info .desc-progress{margin-top:12px;font-size:12px}

/* 剧情简介：标题固定，正文单独滚动 */
.remote .now>.now-desc{display:flex;flex-direction:column;overflow:hidden!important;-webkit-mask-image:none;mask-image:none;padding-bottom:0}
.now-desc>h4{flex:none;margin:0 0 8px}
.now-desc-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:24px;-webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(180deg,#000 calc(100% - 28px),transparent)}
.now-desc-scroll::-webkit-scrollbar{display:none}

@media (max-height:700px){
  .remote .now{height:auto;min-height:calc(100dvh - 52px - var(--tab));overflow:visible;padding-bottom:20px}
  .remote .now>.now-desc{min-height:90px;max-height:180px}
  .remote .now>.cmt-wrap{overflow:visible}
}

/* 我的：身份信息与三项账号数量共用一行，资料下方留出呼吸距离。 */
.me-profile{align-items:center;gap:10px;padding:8px var(--g) 0;margin-bottom:20px;min-height:84px}

.remote .remote-content{padding-top:env(safe-area-inset-top)}
.remote .now{height:calc(100dvh - env(safe-area-inset-top) - var(--tab) - 40px)}

/* Mini bar is a sibling of the dock so its blur can sample page content behind it. */
.dock{height:var(--tab);overflow:visible}
#mini{position:fixed;left:0;right:0;bottom:var(--tab);z-index:41;width:100%;height:62px;box-sizing:border-box;border-radius:0;padding:0 10px 0 16px;gap:12px;transform:none;isolation:isolate}

/* 遥控页：顶部资料固定，只有简介正文滚动；播放控制固定在导航上方。 */
.remote .remote-content{padding-top:calc(env(safe-area-inset-top) + 18px)}
.remote .now{display:flex;flex-direction:column;height:calc(100dvh - env(safe-area-inset-top) - 18px - var(--tab) - 238px);min-height:0;overflow:hidden;padding:6px 24px 0}
.remote .now>.now-top{flex:0 0 auto;margin-top:10px}
.remote .now>.now-desc{display:flex;flex:1 1 auto;flex-direction:column;min-height:0;max-height:none;overflow:hidden!important;margin-top:22px;padding:0;-webkit-mask-image:none;mask-image:none}
.remote .now>.now-desc>h4{flex:none;margin:0 0 8px}
.remote .now .now-desc-scroll{display:block;flex:1 1 auto;min-height:0;max-height:none;overflow-x:hidden;overflow-y:auto!important;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;scrollbar-width:none;padding:0 0 24px}
.remote .now-bottom{position:fixed;left:50%;right:auto;bottom:var(--tab);z-index:30;width:min(100%,440px);max-width:440px;transform:translateX(-50%);margin:0;padding:14px 24px 12px;background:linear-gradient(180deg,rgba(var(--bg-rgb),0),rgba(var(--bg-rgb),.94) 20%,var(--bg) 58%)}

.sheet .comment-tabs-sticky{position:sticky;top:0;z-index:8;margin:0 -22px 12px;padding:6px 22px 10px;background:var(--glass-sheet);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
.sheet .comment-tabs-sticky .me-seg{margin:0}
.sheet .comment-tabs-sticky .seg{flex:1}
/* 迷你播放条 + 导航栏 = 同一块玻璃：材质一致，只在条的顶沿留一道高光和一圈向上的投影；
   条与导航之间只留一条发丝分隔线。去掉原来迷你条自带的四边描边、向下投影，
   以及导航栏自己的向上投影（它们叠在迷你条下面会让条看起来脏、有双层边）。 */
body.has-mini .dock{box-shadow:none}
body.has-mini .dock::before{display:none}
#mini:not(.off){background:var(--glass-dock)!important;-webkit-backdrop-filter:var(--glass-blur)!important;backdrop-filter:var(--glass-blur)!important;border-top:0;
  box-shadow:0 -10px 30px rgba(16,24,40,.08),inset 0 1px 0 var(--glass-rim),inset 0 -.5px 0 var(--bar-line)!important;
  clip-path:inset(-48px 0 0 0)}

#mini::before{display:none!important}

function h(tag,props,...kids){
  const el=document.createElement(tag);

    if(v==null||v===false)continue;
    if(k==='class')el.className=v;
    else if(k==='text')el.textContent=v;

    else if(k.startsWith('on')&&typeof v==='function')el.addEventListener(k.slice(2),v);

  for(const kid of kids.flat()){if(kid==null||kid===false)continue;el.append(kid.nodeType?kid:document.createTextNode(String(kid)))}

}
function icon(name,cls){const s=document.createElementNS(NS,'svg');s.setAttribute('class','i'+(cls?' '+cls:''));s.setAttribute('aria-hidden','true');const u=document.createElementNS(NS,'use');u.setAttribute('href','#i-'+name);s.append(u);return s}

/* ---------------------------------------------------------------- API */
async function api(path,body,signal){
  const attempts=!body&&!path.startsWith('/api/status')?2:1;
  for(let attempt=0;attempt<attempts;attempt++){
    const own=new AbortController(),abort=()=>own.abort();
    const timer=setTimeout(abort,path.startsWith('/api/status')?5000:path.startsWith('/api/detail')?60000:18000);
    if(signal){if(signal.aborted)abort();else signal.addEventListener('abort',abort,{once:true})}
    try{
      const res=await fetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,signal:own.signal});
      let data;try{data=await res.json()}catch(_){const e=Error(res.ok?'电视返回的数据不完整，请重试':'电视暂时没有响应，请稍后重试');e.status=res.status||500;throw e}
      if(data&&(data.needPassword||data.remoteOff||data.rest===true))Gate.block(data);
      if(!res.ok){const e=Error(data.error||(res.status>=500?'电视处理失败，请稍后重试':'请求未完成，请重试'));e.status=res.status;e.gate=!!(data.needPassword||data.remoteOff||data.rest);throw e}
      return data;
    }catch(e){
      if(signal?.aborted)throw e;
      if(e.gate)throw e;
      if(attempt+1<attempts&&(!e.status||e.status>=500)){await new Promise(r=>setTimeout(r,250));continue}
      if(own.signal.aborted)throw Error('电视响应超时，请检查电视是否还在运行');
      /* fetch 的网络失败是英文的 TypeError（Failed to fetch / Load failed），换成用户看得懂的话 */
      if(!e.status&&e instanceof TypeError)throw Error('连接不到电视，请确认手机和电视在同一 Wi‑Fi');
      throw e;
    }finally{clearTimeout(timer);signal?.removeEventListener('abort',abort)}
  }
}

/* ---------------------------------------------------------------- Feedback */
function toast(text){if(!text)return;const t=$('toast');t.textContent=text;t.classList.add('on');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('on'),2400)}
async function clearHistoryOnTv(){
  const result=await api('/api/history/clear',{});toast('正在同步删除记录');
  for(let i=0;i<60;i++){
    const state=(await api('/api/history/clear/status?operation='+encodeURIComponent(result.operation))).status;
    if(state==='success'){toast('观看记录已清空');return true}
    if(state==='failed')throw Error('云端历史清空未完成，请重试');
    if(state==='cancelled'||state==='superseded')throw Error('清空请求已取消或被新请求替代，请检查记录');
    await new Promise(resolve=>setTimeout(resolve,1000));
  }
  toast('仍在同步，请稍后查看观看记录');return false;
}
function ask({title,message='',actions}){
  return new Promise(resolve=>{
    const d=h('dialog',{class:'alert'},h('div',{class:'alert-body'},h('h3',{text:title}),message?h('p',{text:message}):null),
      h('div',{class:'alert-actions'},actions.map(a=>h('button',{class:a.style||'',text:a.label,onclick:()=>{d.returnValue=a.value;d.close()}}))));
    d.addEventListener('close',()=>{d.remove();resolve(d.returnValue||null)});
    d.addEventListener('cancel',e=>{e.preventDefault();d.returnValue='';d.close()});
    document.body.append(d);d.showModal();
  });
}

/* ---------------------------------------------------------------- Images
   字节 CDN 封面支持 ~tplv-shrink:W:0.jpeg：先拉 48px 预览，再按实际尺寸拉清晰图。 */
function previewURL(url){try{const u=new URL(url,location.href);if(/\.(byteimg|fqnovelpic)\.com$/.test(u.hostname)&&u.pathname.includes('/novel-pic/'))return url.split('~')[0]+'~tplv-shrink:48:0.jpeg'}catch(_){}return ''}
function sizedURL(url,width){if(!previewURL(url))return url;const w=Math.min(1080,Math.max(240,Math.ceil(width*Math.min(devicePixelRatio||1,2)/64)*64));return url.split('~')[0]+'~tplv-shrink:'+w+':0.jpeg'}
const decoded=new Map();
function decode(url){
  if(decoded.has(url))return decoded.get(url);
  const p=new Promise((ok,fail)=>{const im=new Image();im.decoding='async';im.referrerPolicy='no-referrer';im.onload=async()=>{try{if(im.decode)await im.decode();ok(im)}catch(e){fail(e)}};im.onerror=fail;im.src=url});
  decoded.set(url,p);p.catch(()=>{if(decoded.get(url)===p)decoded.delete(url)});
  while(decoded.size>40)decoded.delete(decoded.keys().next().value);
  return p;
}
async function paint(img,url){
  const pv=previewURL(url);
  if(pv)try{const im=await decode(pv);if(img.dataset.src===url&&!img.classList.contains('ready')){img.src=im.src;img.classList.add('ready')}}catch(_){}
  if(img.dataset.src!==url)return;
  for(const candidate of [sizedURL(url,img.clientWidth||img.parentElement?.clientWidth||300),url]){
    try{const im=await decode(candidate);if(img.dataset.src===url){img.src=im.src;img.classList.add('ready')}return}catch(_){}
  }
}
const imgQueue=[];let imgJobs=0;
function pump(){while(imgJobs<4&&imgQueue.length){const [img,url]=imgQueue.shift();if(!img.isConnected||img.dataset.src!==url)continue;imgJobs++;paint(img,url).finally(()=>{imgJobs--;pump()})}}
const imgObserver=new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting){imgObserver.unobserve(e.target);imgQueue.push([e.target,e.target.dataset.src])}pump()},{rootMargin:'600px 600px'});
function loadImg(img,url,eager=false){
  if(!url){img.removeAttribute('src');img.dataset.src='';img.classList.remove('ready');return}
  if(img.dataset.src===url&&img.classList.contains('ready'))return;
  img.referrerPolicy='no-referrer';img.decoding='async';img.alt='';img.dataset.src=url;img.classList.remove('ready');
  if(eager)paint(img,url);else imgObserver.observe(img);
}

/* ---------------------------------------------------------------- TV status */
const S={tv:{},at:0,connected:false,checked:false,cmdBusy:false,playBusy:false};
const listeners=new Set();
function onStatus(fn){listeners.add(fn);return()=>listeners.delete(fn)}
function emit(){for(const fn of listeners)try{fn()}catch(e){console.error(e)}}
const playing=()=>S.connected&&!!S.tv.playing;
function position(){const t=S.tv;return Math.min(t.duration||0,(t.position||0)+(t.playing&&!t.paused&&!t.loading&&!t.ended&&!t.error?Math.max(0,Date.now()-S.at)*(t.speed||1):0))}
function stateText(){const t=S.tv;return t.error?'播放出错':t.ended?'已播完':t.loading?'正在准备画面':t.paused?'已暂停':'正在播放'}
let polling=false,seekHold=0;
async function poll(){
  if(polling||document.hidden)return;polling=true;
  try{const t=await api('/api/status');if(Date.now()>seekHold||t.id!==S.tv.id){S.tv=t;S.at=Date.now()}S.connected=true}
  catch(_){S.connected=false}
  finally{
    S.fails=S.connected?0:(S.fails||0)+1;if(S.connected)S.everConnected=true;
    S.checked=true;polling=false;banner(!S.connected&&(S.fails>=2||!S.everConnected));emit();
  }
}
function banner(on){
  const b=$('offline');if(on===!b.hidden&&on===b.classList.contains('on'))return;
  clearTimeout(banner.t);
  if(on){b.hidden=false;requestAnimationFrame(()=>requestAnimationFrame(()=>b.classList.add('on')))}
  else{b.classList.remove('on');banner.t=setTimeout(()=>{b.hidden=true},450)}
}
async function command(action,extra={}){
  if(S.cmdBusy)return false;
  if(!playing()){toast(S.connected?'电视当前没有在播放':'未连接到电视');return false}
  S.cmdBusy=true;
  try{const j=await api('/api/control',{action,version:S.tv.version,...extra});if(j.status){S.tv=j.status;S.at=Date.now()}emit();setTimeout(poll,350);return true}
  catch(e){toast(e.message);poll();return false}
  finally{S.cmdBusy=false}
}
const togglePlay=()=>command(S.tv.error?'retry':S.tv.paused||S.tv.ended?'play':'pause');

/* ---------------------------------------------------------------- Data */
const detailCache=new Map(),seasonCache=new Map();
async function getDetail(id,{fresh=false,signal}={}){
  const c=detailCache.get(id);
  if(c&&!fresh&&Date.now()-c._at<60000)return c;
  const d=await api('/api/detail?id='+id,null,signal);d._at=Date.now();detailCache.set(id,d);
  while(detailCache.size>16)detailCache.delete(detailCache.keys().next().value);
  return d;
}
async function getSeasons(id){
  if(seasonCache.has(id))return seasonCache.get(id);
  const j=await api('/api/seasons?id='+id);
  const rows=(j.items||[]).map(x=>({...x,id:String(x.id)})).filter(x=>Number(x.count)>0||x.id===String(id)).sort((a,b)=>a.number-b.number);
  if(!rows.length)return rows;
  for(const r of rows)seasonCache.set(r.id,rows);return rows;
}
async function play(s,index,resume=false){
  if(S.playBusy)return;S.playBusy=true;
  try{
    await api('/api/play',{id:s.id,index,resume,cover:s.cover||detailCache.get(s.id)?.cover||''});
    toast(resume?'已在电视开始播放':'已在电视播放第 '+(index+1)+' 集');
    switchTab('remote');setTimeout(poll,400);
  }catch(e){toast(e.message)}
  finally{S.playBusy=false}
}
async function setFavorite(s,enabled){
  const j=await api('/api/favorite',{id:s.id,enabled,cover:s.cover||''});   // 追剧与云端同步，没有上限
  const d=detailCache.get(s.id);if(d)d.favorite=!!j.favorite;
  toast(j.favorite?'已加入追剧':'已取消追剧');return !!j.favorite;
}

/* 顶栏：固定高度毛玻璃，常显不渐隐。
   一级页（没有返回键）把页面标题放在左侧当大标题；二级页是「返回 + 居中标题」。 */
function navbar({title='',left=[],right=[],cls=''}={}){
  if(!left.length&&title)return h('header',{class:'navbar root-bar '+cls},h('h1',{class:'bar-title',text:title}),h('div',{class:'spacer'}),...right);
  return h('header',{class:'navbar '+cls},...left,h('div',{class:'spacer'}),...right,h('div',{class:'nav-title',text:title}));
}

/* 剧集卡：标题一行，标题下不放任何文字；集数 / 观看进度（已看/全部）压在封面右下角，和电视端一致 */
function tile(s,opt={}){
  const img=h('img');const poster=h('div',{class:'poster'},img);
  const badge=opt.badge!==undefined?opt.badge:(s.count?s.count+'集':'');
  if(badge)poster.append(h('div',{class:'shade'}),h('span',{class:'count-badge',text:badge}));
  const art=opt.rank?h('div',{class:'rank-art'},h('span',{class:'rank-num',text:String(opt.rank)}),poster):poster;
  const b=h('button',{class:'tile pressable','aria-label':s.title,onclick:()=>openDetail(s)},art,h('div',{class:'tile-title',text:s.title||''}));
  loadImg(img,s.cover);return b;
}
function skeletonTile(){return h('div',{class:'tile skeleton','aria-hidden':'true'},h('div',{class:'poster'}),h('div',{class:'sk-line'}),h('div',{class:'sk-line short'}))}
function libraryProgress(s){return s.duration>0?Math.min(1,s.position/s.duration):null}
function libraryMeta(s){return s.lastEpisode?(s.count?s.lastEpisode+'/'+s.count:'第'+s.lastEpisode+'集'):(s.count?s.count+'集':'')}

/* Paged list → grid with infinite scroll. fetch(state,signal) returns {items,offset,more,session}. */
function pagedGrid({fetch,map=s=>tile(s),empty='暂时没有内容',onDone}){
  const grid=h('div',{class:'grid'}),end=h('div',{class:'list-end'}),sentinel=h('div',{class:'sentinel'});
  const el=h('div',{},grid,end,sentinel);
  let st=null,token=0,ctrl=null;
  const io=new IntersectionObserver(es=>{if(es[0].isIntersecting)more()},{rootMargin:'900px'});
  function reset(){token++;ctrl?.abort();st={items:[],seen:new Set(),offset:0,session:'',more:true,busy:false,empties:0,feed:0,first:true};
    grid.replaceChildren(...Array.from({length:9},skeletonTile));end.replaceChildren();io.observe(sentinel);more()}
  /* 数据还没开始拉（比如在等页签）时先占位，避免加载完再撑开 */
  function placeholder(){if(!grid.children.length)grid.replaceChildren(...Array.from({length:9},skeletonTile))}
  async function more(){
    if(!st||st.busy||!st.more)return;st.busy=true;const my=token;ctrl=new AbortController();
    if(!st.first)grid.append(...Array.from({length:3},skeletonTile));
    end.replaceChildren();
    try{
      const j=await fetch(st,ctrl.signal);if(my!==token)return;
      for(const t of grid.querySelectorAll('.skeleton'))t.remove();
      st.offset=j.offset??st.offset;st.session=j.session||'';st.more=!!j.more;
      const fresh=(j.items||[]).filter(x=>x&&!st.seen.has(x.id)&&st.seen.add(x.id));
      st.first=false;st.items.push(...fresh);grid.append(...fresh.map(map));
      st.empties=fresh.length?0:st.empties+1;
      if(!st.more&&st.advance?.())st.more=true;
      if(st.empties>=3)st.more=false;
      if(!st.more){if(!st.items.length){if(empty)end.append(h('span',{text:empty}))}else end.append(h('span',{text:'已经到底啦'}));onDone?.(st,j)}
    }catch(e){
      if(my!==token||e.name==='AbortError')return;
      for(const t of grid.querySelectorAll('.skeleton'))t.remove();
      end.append(h('span',{text:e.message||'加载失败'}),h('button',{class:'btn btn-fill',text:'重新加载',onclick:()=>{st.busy=false;more()}}));
      st.busy=false;return;
    }
    st.busy=false;
    requestAnimationFrame(()=>{if(my===token&&el.isConnected&&!el.closest('[hidden]')&&sentinel.getBoundingClientRect().top<innerHeight+900)more()});
  }
  return {el,reset,placeholder,state:()=>st,destroy(){io.disconnect();ctrl?.abort();token++}};
}

/* Episode picker shared by detail + remote. */
