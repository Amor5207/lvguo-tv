plugins {
    id 'com.android.application' version '8.5.2'
}

def applicationIdValue = providers.gradleProperty('lvguoApplicationId').getOrElse('ink.pengfei.lvguo')
def versionCodeValue = Integer.parseInt(providers.gradleProperty('lvguoVersionCode').getOrElse('2010'))
def versionNameValue = providers.gradleProperty('lvguoVersionName').getOrElse('2.0.10')
def manifestFileValue = providers.gradleProperty('lvguoManifest').getOrElse('AndroidManifest.xml')

dependencies {
    implementation files('libs/zxing-core-3.5.3.jar')
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
}

android {
    namespace 'ink.pengfei.lvguo'
    compileSdk 35

    defaultConfig {
        applicationId applicationIdValue
        minSdk 23
        targetSdk 28
        versionCode versionCodeValue
        versionName versionNameValue
        manifestPlaceholders = [appLabel: providers.gradleProperty('lvguoAppLabel').getOrElse('@string/app_name'),
                                updateChannel: providers.gradleProperty('lvguoUpdateChannel').getOrElse('stable')]
    }

    sourceSets {
        main {
            manifest.srcFile manifestFileValue
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }

    // TV APKs are sideloaded; keep the existing runtime target while checking other lint rules.
    lint { disable 'ExpiredTargetSdkVersion' }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
