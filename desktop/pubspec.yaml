name: lvguo_desktop
description: "绿果PC 独立桌面客户端（Windows / macOS / Linux）"
publish_to: 'none'
version: 2.1.0+2100

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  ffi: ^2.1.3
  media_kit: ^1.2.0
  media_kit_video: ^1.3.0
  media_kit_libs_video: ^1.0.5
  shared_preferences: ^2.3.3
  window_manager: ^0.4.3
  file_picker: ^8.1.4
  path_provider: ^2.1.5
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/emoji/
    - assets/shaders/cas_sharpen.glsl
    - assets/shaders/fsr_superres.glsl
