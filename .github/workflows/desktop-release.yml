name: Desktop Multi-Platform Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '可选：附加产物到指定 Release Tag（如 v2.1.0），留空仅保留 Artifacts'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/rust -> target"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64
          cache: true

      - name: Install Inno Setup 6
        shell: powershell
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") -and -not (Test-Path "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y
          }

      - name: Build Windows x64
        shell: powershell
        run: |
          Set-Location desktop
          .\scripts\build_windows.ps1 -Arch x64

      - name: Upload Windows x64 Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lvguo-pc-windows-x64
          path: |
            desktop/dist/LvguoPC-Setup-*-win-x64.exe

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/rust -> target"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build macOS universal
        run: |
          chmod +x desktop/scripts/build_macos.sh
          ./desktop/scripts/build_macos.sh --arch universal

      - name: Upload macOS universal Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lvguo-pc-macos-universal
          path: |
            desktop/dist/LvguoPC-*-macOS-universal.dmg

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
          - arch: arm64
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libmpv-dev mpv libasound2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/rust -> target"

      - name: Setup Flutter
        if: matrix.arch == 'x64'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: ${{ matrix.arch }}
          cache: true

      - name: Setup Flutter (ARM64)
        if: matrix.arch == 'arm64'
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Build Linux ${{ matrix.arch }}
        run: |
          chmod +x desktop/scripts/build_linux.sh
          ./desktop/scripts/build_linux.sh --arch ${{ matrix.arch }}

      - name: Upload Linux ${{ matrix.arch }} Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lvguo-pc-linux-${{ matrix.arch }}
          path: |
            desktop/dist/LvguoPC-*-linux-${{ matrix.arch }}.deb

  release:
    needs: [windows, macos, linux]
    if: always() && (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '') && (needs.windows.result == 'success' || needs.macos.result == 'success' || needs.linux.result == 'success')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download All Platform Installers
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            artifacts/*

      - name: Print Installer Links Summary
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## 绿果PC 桌面端打包链接（${TAG}）"
            echo ""
            for f in artifacts/*; do
              [ -f "$f" ] || continue
              name="$(basename "$f")"
              echo "- **${name}**: \`https://github.com/${REPO}/releases/download/${TAG}/${name}\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
